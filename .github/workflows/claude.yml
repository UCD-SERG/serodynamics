# Calls the reusable Claude Code workflow in d-morrison/gha. Secrets passed
# explicitly so the cross-repo call forwards a real token. The reusable enforces
# the @claude mention + trusted-author gate.
#
# Pinned to the @v2 moving major tag.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    uses: d-morrison/gha/.github/workflows/claude.yml@v2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      # serodynamics is an R package; rjags/runjags need the JAGS system library.
      # setup-r defaults true and r-extra-packages' default `local::.` installs
      # the package (and its rjags/runjags deps) on top of JAGS.
      apt-packages: jags

# There is deliberately no local review-dispatch job here. One existed, to
# cover `@claude, please review` -- a phrasing the reusable workflow's own
# matcher missed (#230). d-morrison/gha#341 fixed that matcher upstream, so
# the local job became a duplicate: a plain `@claude review` matched both and
# dispatched two paid review runs, which could review different heads since
# the local job had no `needs: claude` (#277). Dispatch now happens only in
# the reusable workflow, which applies its own trusted-author gate.
