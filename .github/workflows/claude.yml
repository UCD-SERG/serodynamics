# Calls the reusable Claude Code workflow in d-morrison/gha. Secrets passed
# explicitly so the cross-repo call forwards a real token. The reusable enforces
# the @claude mention + trusted-author gate.
#
# Pinned to the @v2 moving major tag.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    uses: d-morrison/gha/.github/workflows/claude.yml@v2
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      # serodynamics is an R package; rjags/runjags need the JAGS system library.
      # setup-r defaults true and r-extra-packages' default `local::.` installs
      # the package (and its rjags/runjags deps) on top of JAGS.
      apt-packages: jags

  dispatch-explicit-review:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.sender.type != 'Bot' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch Claude Code Review for explicit review requests
        run: |
          comment_body=$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")
          shopt -s nocasematch
          if [[ "$comment_body" =~ @claude[[:space:][:punct:]]*(please[[:space:]]+)?review([[:space:][:punct:]]|$) ]]; then
            gh workflow run "claude-code-review.yml" \
              --repo "$GITHUB_REPOSITORY" \
              -f pr_number="${{ github.event.issue.number }}"
          else
            echo "Comment is not an explicit @claude review request; skipping dispatch."
          fi
